<rect width="1200" height="620" fill="white"/>
<text x="30" y="40" font-size="26" text-anchor="start" font-weight="bold">Zero unsafe không đồng nghĩa phục hồi nhiệm vụ</text>
<text x="30" y="71" font-size="16" text-anchor="start" font-weight="normal">Main: deterministic actor; 30 tasks × 5 seeds mỗi regime/policy. Không thực thi refund.</text>
