<text x="890" y="488" font-size="15" text-anchor="middle" font-weight="normal">independent</text>
<rect x="987" y="458.0" width="28" height="0.0" fill="#355c9a"/>
<text x="1001" y="448.0" font-size="13" text-anchor="middle" font-weight="normal">0/50</text>
<rect x="1025" y="458.0" width="28" height="0.0" fill="#16806a"/>
<text x="1039" y="448.0" font-size="13" text-anchor="middle" font-weight="normal">0/50</text>
<rect x="1063" y="458.0" width="28" height="0.0" fill="#707780"/>
<text x="1077" y="448.0" font-size="13" text-anchor="middle" font-weight="normal">0/50</text>
<text x="1040" y="488" font-size="15" text-anchor="middle" font-weight="normal">targeted</text>
<text x="30" y="535" font-size="16" text-anchor="start" font-weight="normal">Targeted: cả hai policies chỉ đúng 0/50 expected-refund decisions; missed refunds do actor không tạo proposal.</text>
<text x="30" y="567" font-size="15" text-anchor="start" font-weight="normal">Always-escalate là counterfactual hậu nghiệm, không measured baseline cùng K=2. Bars không có CI.</text>
<text x="30" y="595" font-size="15" text-anchor="start" font-weight="normal">Tỷ lệ dùng hai mẫu số riêng. Không suy production safety, successful recovery hoặc live-agent effectiveness.</text>
</svg>
