<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img">
<title>Safety và utility trong main study</title><desc>Hai policies quan sát và always-escalate counterfactual; hai panel có mẫu số khác nhau, không phải giao dịch thật.</desc>
